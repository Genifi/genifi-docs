site_name: JET Documentation
site_description: >-
  JET is a cross-border payment rail. You send a stablecoin amount; your
  recipient is paid in their local currency.
site_url: https://docs.jet.money

docs_dir: docs

# Fail the build on a broken internal link or a page missing from the nav.
# Docs that quietly lose a link are worse than docs that fail loudly in CI.
strict: true
# Including a link to a heading that does not exist: the generated API
# reference links into the guides by anchor, and a renamed heading must fail.
validation:
  anchors: warn

# Kept in the repo for the GitBook space, not part of the built site.
exclude_docs: |
  SUMMARY.md

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: README.md

  - Backend API:
      - Overview: backend/README.md
      - Getting started:
          - Quickstart: backend/getting-started/quickstart.md
          - Authentication: backend/getting-started/authentication.md
          - Environments: backend/getting-started/environments.md
      - Core concepts:
          - How a payment works: backend/concepts/payment-lifecycle.md
          - Amounts and currencies: backend/concepts/money.md
          - Corridors: backend/concepts/corridors.md
          - Idempotency: backend/concepts/idempotency.md
      - Guides:
          - Conventions: backend/api/conventions.md
          - Discovery: backend/api/discovery.md
          - Quotes: backend/api/quotes.md
          - Payments: backend/api/transactions.md
          - Batch payouts: backend/api/batches.md
          - Balance and wallets: backend/api/wallets-and-accounts.md
          - Deposits: backend/api/treasury.md
          - Withdrawals and off-ramps: backend/api/withdrawals.md
          - Recipients: backend/api/recipients.md
          - Team and API keys: backend/api/team.md
          - Statements: backend/api/statements.md
          - Notifications: backend/api/notifications.md
      # Generated from the API source by `pnpm api:reference` in the backend repo.
      # Do not edit the lines between the markers by hand.
      - API reference:
          # BEGIN generated: api-reference
          - Overview: backend/api-reference/README.md
          - Discovery: backend/api-reference/discovery.md
          - Quotes and payments: backend/api-reference/payments.md
          - Batch payouts: backend/api-reference/batches.md
          - Balance and wallets: backend/api-reference/balance.md
          - Deposits: backend/api-reference/deposits.md
          - Withdrawals and off-ramps: backend/api-reference/withdrawals.md
          - Recipients: backend/api-reference/recipients.md
          - Team and API keys: backend/api-reference/team.md
          - Webhooks: backend/api-reference/webhooks.md
          - Email notifications: backend/api-reference/notifications.md
          - Statements: backend/api-reference/statements.md
          - Sandbox tools: backend/api-reference/sandbox.md
          - Error codes: backend/api-reference/errors.md
          - Shared types: backend/api-reference/types.md
          # END generated: api-reference
      - Webhooks:
          - Overview: backend/webhooks/README.md
          - Event types: backend/webhooks/events.md
          - Verifying signatures: backend/webhooks/verifying.md
      - Reference:
          - Errors: backend/reference/errors.md
          - Rate limits: backend/reference/rate-limits.md

  - Dashboard:
      - Overview: dashboard/README.md
      - Getting started:
          - Signing in: dashboard/getting-started/signing-in.md
          - A tour of the dashboard: dashboard/getting-started/tour.md
          - Demo mode: dashboard/getting-started/demo-mode.md
      - Guides:
          - Send a payment: dashboard/guides/send-a-payment.md
          - Track transactions: dashboard/guides/track-transactions.md
          - Wallets and funding: dashboard/guides/wallets-and-funding.md
          - The address book: dashboard/guides/address-book.md
          - API keys and webhooks: dashboard/guides/api-keys-and-webhooks.md
          - Your team: dashboard/guides/team-and-roles.md
          - Email notifications: dashboard/guides/notifications.md
          - Exports and receipts: dashboard/guides/exports-and-receipts.md
      - Reference:
          - What's available: dashboard/reference/feature-availability.md
          - Troubleshooting: dashboard/reference/troubleshooting.md
